<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gutter Sketch">
<meta name="theme-color" content="#001738">
<meta name="robots" content="noindex, nofollow">
<title>Gutter Sketch — Sergeant Seamless</title>
<style>
:root{--navy:#001738;--gold:#FFCE34;--cream:#FFF0C3;--red:#F15D22;--grey:#c9c9c9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--navy);overscroll-behavior:none;position:fixed;inset:0}
button{font:inherit;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--navy)}
#stage{position:relative;flex:1;overflow:hidden;background:#fff}
#cv{position:absolute;inset:0;touch-action:none;background:#fff;display:block}
.btn{min-height:48px;padding:0 14px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:15px;white-space:nowrap}
.btn.active{background:var(--gold);color:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{min-height:40px;font-size:14px;padding:0 10px}
.btn:disabled{opacity:.4}
.hidden{display:none!important}

/* ---------- FIELD MODE ---------- */
body.full #fieldUI{display:none}
body.field #fullUI{display:none}
#fieldUI .bigbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:var(--navy)}
#fieldUI .big{flex:1;min-height:104px;font-size:32px;font-weight:900;letter-spacing:1px;border-radius:16px;background:#fff;color:var(--navy);border:0}
#fieldUI .big.active{background:var(--gold)}
#fieldUI .big:active{transform:scale(.97)}
#fieldUI .ftop{position:absolute;top:0;left:0;right:0;display:flex;gap:10px;padding:10px;padding-top:calc(10px + env(safe-area-inset-top));pointer-events:none;align-items:flex-start}
#fieldUI .ftop>*{pointer-events:auto}
#fieldUI .ftop .btn{min-height:72px;font-size:22px;border-radius:14px;padding:0 20px}
#fieldUI .ftop .btn.active{background:var(--gold);border-color:var(--gold)}
#fieldUI .ftop .spacer{flex:1}
#fieldHint{position:absolute;left:50%;transform:translateX(-50%);top:calc(92px + env(safe-area-inset-top));background:var(--navy);color:#fff;font-weight:800;font-size:22px;padding:12px 22px;border-radius:14px;pointer-events:none;text-align:center;max-width:90vw}
#fieldHint:empty{display:none}

/* continue bar (both modes) */
#contBar{position:absolute;left:50%;transform:translateX(-50%);bottom:130px;display:flex;gap:10px;align-items:center;background:var(--cream);border:3px solid var(--navy);border-radius:14px;padding:8px 8px 8px 16px;font-weight:700;font-size:17px;z-index:5}
body.full #contBar{bottom:16px}
#contBar .btn{min-height:56px}

/* ---------- FULL MODE ---------- */
#fullUI{display:flex;flex-direction:column;position:absolute;inset:0;pointer-events:none}
#fullUI>*{pointer-events:auto}
#topbar{display:flex;gap:8px;padding:8px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--navy);flex-wrap:wrap;align-items:center}
#topbar input{min-height:44px;border:0;border-radius:8px;padding:0 10px;font-size:15px;background:#fff;color:var(--navy)}
#topbar .f{display:flex;flex-direction:column;gap:2px;color:var(--cream);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
#toolbar{display:flex;gap:6px;padding:6px 8px;background:#0b2a5c;flex-wrap:wrap;align-items:center}
#toolbar .btn{min-height:48px}
#toolbar .grow{flex:1}
#fullStage{position:relative;flex:1;pointer-events:none}
#fullStage>*{pointer-events:auto}

/* palette */
#palette{position:absolute;right:8px;top:8px;bottom:60px;width:232px;background:var(--cream);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden;transition:transform .2s}
#palette.collapsed{transform:translateX(192px)}
#palette .phead{display:flex;align-items:center;gap:6px;padding:6px;background:var(--navy);color:#fff;font-weight:800;font-size:14px}
#palette .phead .btn{min-height:40px;padding:0 10px}
#palette .pbody{overflow:auto;padding:8px;flex:1}
#palette.collapsed .pbody{display:none}
.pgroup{margin-bottom:10px}
.pgroup h4{margin:4px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#5a5a5a}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pgrid .btn{min-height:48px;font-size:13px;padding:0 6px;background:#fff;color:var(--navy);border:2px solid var(--navy)}
.pgrid .btn.active{background:var(--gold)}
.pgrid .btn.wide{grid-column:span 2}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:48px;height:48px;border-radius:10px;border:3px solid transparent}
.sw.active{border-color:var(--gold);box-shadow:0 0 0 2px var(--navy)}
.ginfo{font-size:12px;margin-top:4px}

/* photo strip */
#photoStrip{position:absolute;left:8px;bottom:60px;right:250px;height:84px;display:flex;gap:6px;overflow-x:auto;padding:6px;background:rgba(255,240,195,.95);border-radius:12px}
#photoStrip:empty{display:none}
#photoStrip .th{position:relative;flex:none;width:72px;height:72px;border-radius:8px;overflow:hidden;border:3px solid var(--navy);background:#000}
#photoStrip .th img{width:100%;height:100%;object-fit:cover}
#photoStrip .th span{position:absolute;left:3px;top:3px;background:var(--gold);color:var(--navy);font-weight:900;font-size:13px;border-radius:999px;min-width:22px;text-align:center;padding:2px 4px}

/* material panel */
#matPanel{position:absolute;left:0;right:0;bottom:0;background:var(--cream);border-top:4px solid var(--navy);max-height:46%;display:flex;flex-direction:column;transition:max-height .2s;z-index:7}
#matPanel.collapsed{max-height:52px}
#matPanel .mhead{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--navy);color:#fff;font-weight:800}
#matPanel .mhead .btn{min-height:40px}
#matPanel .mtabs{display:flex;gap:6px;flex-wrap:wrap}
#matPanel .mtabs .btn{min-height:36px;font-size:13px;padding:0 10px;background:#0b2a5c}
#matPanel .mbody{overflow:auto;padding:8px 12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
#matPanel.collapsed .mbody{display:none}
@media (max-width:760px){#matPanel .mbody{grid-template-columns:1fr}}
.mcol h4{margin:4px 0;font-size:12px;text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:6px}
.tag{font-size:10px;background:var(--navy);color:#fff;border-radius:6px;padding:2px 6px;text-transform:none;letter-spacing:0;font-weight:600}
.mt{width:100%;border-collapse:collapse;font-size:14px}
.mt td{padding:4px 6px;border-bottom:1px solid #e3d6a3}
.mt td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.mt tr.sub td{font-size:12px;color:#444;padding-left:18px}
.mt input{width:110px;min-height:40px;border:1px solid var(--navy);border-radius:6px;padding:0 8px;background:#fff;text-align:right}
.mfields{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:13px}
.mfields label{display:flex;flex-direction:column;gap:2px;font-weight:700}
.mfields input,.mfields select,.mfields textarea{min-height:40px;border:1px solid var(--navy);border-radius:6px;padding:4px 8px;background:#fff;font-weight:400}
.mfields .full{grid-column:span 2}

/* overlays / sheets */
.overlay{position:fixed;inset:0;background:rgba(0,23,56,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.sheet{background:var(--cream);border-radius:18px;padding:16px;max-width:96vw;max-height:92vh;overflow:auto;min-width:min(360px,96vw);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.sheet h3{margin:0 0 10px;font-size:18px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.sheet label.l{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;width:100%}
.sheet input[type=text],.sheet input[type=number],.sheet textarea{min-height:48px;border:2px solid var(--navy);border-radius:10px;padding:6px 10px;font-size:18px;background:#fff;flex:1;min-width:120px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn{background:#fff;color:var(--navy);border:2px solid var(--navy);min-width:56px}
.seg .btn.active{background:var(--gold)}
.seg.big .btn{min-height:72px;font-size:26px;min-width:72px;padding:0 12px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.actions .btn{min-height:56px;font-size:17px;padding:0 20px}
.seqbox{min-height:56px;border:2px solid var(--navy);border-radius:10px;background:#fff;font-size:28px;font-weight:900;letter-spacing:4px;padding:6px 12px;flex:1;display:flex;align-items:center;min-width:140px}
.seqbox:empty::before{content:"—";color:#aaa}

/* numpad */
#numpad .disp{font-size:44px;font-weight:900;text-align:right;background:#fff;border:3px solid var(--navy);border-radius:14px;padding:8px 16px;min-height:72px;margin-bottom:10px}
#numpad .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#numpad .keys .btn{min-height:76px;font-size:30px;background:#fff;color:var(--navy);border:2px solid var(--navy)}
#numpad .keys .btn.op{background:var(--navy);color:#fff}
#numpad .keys .btn.done{background:var(--gold);color:var(--navy);grid-column:span 3;font-size:28px}

/* prop panel (select) */
#props{position:absolute;left:8px;top:8px;width:300px;max-height:min(62%,calc(100% - 80px));overflow:auto;background:var(--cream);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.3);padding:10px;z-index:6}
#props h3{margin:0 0 8px;font-size:16px}
#props .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
#props label.l{font-size:11px;font-weight:800;text-transform:uppercase;width:100%;letter-spacing:.5px}
#props .seg .btn{min-height:44px;font-size:13px;min-width:44px;padding:0 8px}
#props input[type=text],#props input[type=number]{min-height:44px;border:2px solid var(--navy);border-radius:8px;padding:4px 8px;font-size:16px;background:#fff;flex:1;min-width:80px}
#props .actions .btn{min-height:48px;font-size:15px}

/* job list */
.joblist{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.jobrow{display:flex;gap:8px;align-items:center;background:#fff;border-radius:10px;padding:8px}
.jobrow .jt{flex:1;min-width:0}
.jobrow .jt b{display:block;font-size:16px}
.jobrow .jt span{font-size:13px;color:#444}
.vlist{margin:0;padding-left:20px;font-size:16px;line-height:1.5}
#photoView img{max-width:92vw;max-height:70vh;border-radius:10px;background:#000}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:40%;background:var(--navy);color:#fff;padding:14px 22px;border-radius:14px;font-weight:800;font-size:18px;z-index:99;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
</style>
</head>
<body class="field">
<div id="app">
<div id="stage">
  <canvas id="cv"></canvas>

  <!-- ===== FIELD MODE UI ===== -->
  <div id="fieldUI">
    <div class="ftop">
      <button class="btn ghost" id="fUndo">↶ UNDO</button>
      <button class="btn ghost" id="fJobs">JOBS</button>
      <button class="btn ghost" id="fExist">EXISTING</button>
      <span class="spacer"></span>
      <button class="btn gold" id="fFinish">FINISH IN TRUCK ▸</button>
    </div>
    <div id="fieldHint"></div>
    <div class="bigbar">
      <button class="big" id="fRun">RUN</button>
      <button class="big" id="fDs">DOWNSPOUT</button>
      <button class="big" id="fPhoto">PHOTO</button>
    </div>
  </div>

  <!-- continue-from-last-run bar -->
  <div id="contBar" class="hidden">
    <span id="contLabel">Continue from last run end?</span>
    <button class="btn gold" id="contYes">CONTINUE</button>
    <button class="btn ghost" id="contNo">NEW START</button>
  </div>

  <!-- ===== FULL MODE UI ===== -->
  <div id="fullUI">
    <div id="topbar">
      <label class="f">Customer<input id="jCustomer" type="text" placeholder="Last, First" autocomplete="off"></label>
      <label class="f" style="flex:1;min-width:200px">Address<input id="jAddress" type="text" placeholder="123 Street, City" autocomplete="off" style="width:100%"></label>
      <label class="f">Date<input id="jDate" type="date"></label>
      <label class="f">Jobber Quote #<input id="jQuote" type="text" placeholder="#" style="width:110px" autocomplete="off"></label>
      <label class="f">Prepared by<input id="jPrep" type="text" placeholder="Name" style="width:130px" autocomplete="off"></label>
    </div>
    <div id="toolbar">
      <button class="btn" id="tUndo">↶ Undo</button>
      <button class="btn" id="tRedo">↷ Redo</button>
      <button class="btn" id="tSelect" data-tool="select">Select</button>
      <button class="btn" id="tMulti" title="Select several items at once">Multi</button>
      <button class="btn" id="tPan" data-tool="pan">Pan/Zoom</button>
      <button class="btn ghost" id="tField">◂ Field Mode</button>
      <span class="grow"></span>
      <button class="btn ghost" id="tBg">Background</button>
      <button class="btn ghost" id="tJobs">Jobs</button>
      <button class="btn ghost" id="tNew">New job</button>
      <button class="btn gold" id="tPng">PNG</button>
      <button class="btn gold" id="tPdf">Export PDF</button>
    </div>
    <div id="fullStage">
      <!-- right palette -->
      <div id="palette">
        <div class="phead"><button class="btn" id="pToggle">◂</button><span id="pTitle">Tools</span></div>
        <div class="pbody">
          <div class="pgroup"><h4>Group</h4>
            <div class="swatches" id="groupSw"></div>
            <div class="ginfo" id="groupInfo"></div>
          </div>
          <div class="pgroup"><h4>Gutter</h4>
            <div class="pgrid">
              <button class="btn wide" data-tool="run">Gutter Run</button>
              <button class="btn wide" data-tool="run" data-sub="existing">Existing Gutter (dashed)</button>
              <button class="btn wide" data-tool="ds">Downspout</button>
            </div>
          </div>
          <div class="pgroup"><h4>Accessories</h4>
            <div class="pgrid">
              <button class="btn" data-tool="acc" data-sub="splashguard">Splash Guard</button>
              <button class="btn" data-tool="acc" data-sub="splashblock">Splash Block</button>
              <button class="btn" data-tool="acc" data-sub="dripedge">Drip Edge Ext.</button>
              <button class="btn" data-tool="acc" data-sub="rainchain">Rain Chain</button>
            </div>
          </div>
          <div class="pgroup"><h4>Story labels (drop on a section)</h4>
            <div class="pgrid" style="grid-template-columns:repeat(3,1fr)">
              <button class="btn" data-tool="tag" data-sub="1">1 st</button>
              <button class="btn" data-tool="tag" data-sub="1.5">1.5 st</button>
              <button class="btn" data-tool="tag" data-sub="2">2 st</button>
              <button class="btn" data-tool="tag" data-sub="2.5">2.5 st</button>
              <button class="btn" data-tool="tag" data-sub="3">3 st</button>
            </div>
          </div>
          <div class="pgroup"><h4>Hazards / Attention</h4>
            <div class="pgrid">
              <button class="btn" data-tool="haz" data-sub="ac">AC Unit</button>
              <button class="btn" data-tool="haz" data-sub="pool">Pool</button>
              <button class="btn" data-tool="haz" data-sub="dish">Sat. Dish</button>
              <button class="btn" data-tool="haz" data-sub="septic">Septic/Well</button>
              <button class="btn" data-tool="haz" data-sub="power">Power Line</button>
              <button class="btn" data-tool="haz" data-sub="landscape">Landscaping</button>
              <button class="btn wide" data-tool="haz" data-sub="warn">⚠ Warning</button>
            </div>
          </div>
          <div class="pgroup"><h4>Ink &amp; Text</h4>
            <div class="pgrid">
              <button class="btn" data-tool="ink">Pencil Ink</button>
              <button class="btn" data-tool="text">Text Callout</button>
            </div>
            <div class="swatches" style="margin-top:6px">
              <button class="sw" data-ink="#000000" style="background:#000"></button>
              <button class="sw" data-ink="#001738" style="background:#001738"></button>
              <button class="sw" data-ink="#F15D22" style="background:#F15D22"></button>
              <button class="btn sm" data-inkw="3" style="min-width:48px">Thin</button>
              <button class="btn sm" data-inkw="7" style="min-width:48px">Thick</button>
            </div>
          </div>
        </div>
      </div>

      <!-- props panel -->
      <div id="props" class="hidden"></div>

      <!-- photo strip -->
      <div id="photoStrip"></div>

      <!-- material list -->
      <div id="matPanel" class="collapsed">
        <div class="mhead">
          <button class="btn" id="mToggle">▴</button>
          <span>Material List</span>
          <span class="mtabs" id="mTabs"></span>
          <span style="flex:1"></span>
          <span class="tag">live · from drawing</span>
        </div>
        <div class="mbody">
          <div class="mcol" id="mAuto"></div>
          <div class="mcol" id="mManual"></div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>

<input type="file" id="camInput" accept="image/*" capture="environment" class="hidden">
<input type="file" id="bgInput" accept="image/*,application/pdf" class="hidden">
<div id="sheets"></div>
<div id="toast"></div>
<a id="dl" class="hidden"></a>

<!-- PDF library loads in the background so a slow connection never blocks the app; pdf.js is fetched only when a PDF is imported -->
<script async src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(() => {
'use strict';
/* =====================================================================
   Gutter Sketch — Sergeant Seamless Gutter Services
   Single-file field sketch app. No backend. Vanilla JS.
   ===================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const dist = (a,b,c,d) => Math.hypot(c-a, d-b);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

const GROUPS = [
  {n:'Base',     c:'#001738', short:'B'},
  {n:'Option 1', c:'#FFCE34', short:'1'},
  {n:'Option 2', c:'#F15D22', short:'2'},
  {n:'Option 3', c:'#4E58A7', short:'3'},
  {n:'Option 4', c:'#91982C', short:'4'},
  {n:'Option 5', c:'#252379', short:'5'},
];
const NAVY='#001738', GOLD='#FFCE34', CREAM='#FFF0C3', RED='#F15D22', ERR='#E00000';
const GRID = 20;                 // world units per grid square
const PROFILES = ['6"K','7"K','Half Round','EuroBox','Other'];
const ENDS = [['auto','Auto'],['endcap','End cap'],['miter_in','Miter inside'],['miter_out','Miter outside'],['miter_bay','Miter bay'],['continues','Continues']];
const STORIES = [[1,'1 story'],[1.5,'1.5 story'],[2,'2 story'],[2.5,'2.5 story'],[3,'3 story'],['LR','Lower roof']];
const STRAPS = {1:2, 1.5:3, 2:3, 2.5:4, 3:4, LR:2};   // pipe bands per downspout by story (lower-roof drop assumed short)
const storyLabel = s => s==='LR' ? 'LR' : `${s}st`;
const storyName = s => s==='LR' ? 'Lower roof' : `${s} story`;
const SEQ_TOKENS = ['A','B','2"','4"','6"'];             // elbow / offset tokens, tapped in order
const OFFSET_SIZES = ['2"','4"','6"'];
const CALLOUT_PRESETS = ['Tie-in', 'Tie-in to existing', 'Remove existing', 'Reuse existing DS'];
const DS_SIZES = ['3x4','4" round','4x5','square'];
const TERMS = [['splashblock','Splash block'],['drain','Drain'],['driveway','Driveway'],['rainchain','Rain chain'],['other','Other']];
const ACC = {splashguard:{n:'Splash guard',ab:'SG'}, splashblock:{n:'Splash block',ab:'SB'}, offset:{n:'Offset / jog',ab:'OFF'}, dripedge:{n:'Drip edge ext.',ab:'DE'}, rainchain:{n:'Rain chain',ab:'RC'}};
const HAZ = {ac:{n:'AC unit',ab:'AC'}, pool:{n:'Pool',ab:'POOL'}, dish:{n:'Satellite dish',ab:'SAT'}, septic:{n:'Septic / well',ab:'SEP'}, power:{n:'Power line',ab:'PWR'}, landscape:{n:'Landscaping',ab:'LS'}, warn:{n:'Warning',ab:'!'}};

/* ---------------- storage ---------------- */
const LS_KEY = 'gs_store_v1';
let store = {jobs:{}, order:[], current:null};
function loadStore(){ try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && s.jobs && s.order) store = s; } catch(e){} }
function saveStore(){ try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch(e){ toast('Autosave failed — storage full?'); } }

const idb = {
  db:null,
  open(){ return new Promise((res) => {
    if (!('indexedDB' in window)) return res();

  if (tool==='haz') { snapshot(); job.items.push({type:'haz', sub:toolSub, id:uid(), x:w.x, y:w.y}); afterItemsChanged(); return; }

  const openedAt = performance.now(), guard = (openedAt - lastCanvasUp) < 400; // swallow the "ghost click" the browser fires right after the canvas tap that opened this sheet
  ov.addEventListener('click', e => { if (guard && performance.now() - openedAt < 350) { e.stopPropagation(); e.preventDefault(); } }, true);
  ov.addEventListener('click', e => { const b = e.target.closest('[data-seg] > button'); if (!b) return; b.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('active')); b.classList.add('active'); });
  if (opts.dismiss!==false) ov.addEventListener('pointerdown', e => { if (e.target===ov && (!guard || performance.now() - openedAt > 350)) { closeSheet(); opts.onCancel && opts.onCancel(); } }); return ov; }
function closeSheet(){ if (sheetEl) { sheetEl.remove(); sheetEl = null; } }
function segHTML(name, opts, val, big){ return `<div class="seg ${big?'big':''}" data-seg="${name}">${opts.map(o => { const [v,l] = Array.isArray(o)?o:[o,o]; return `<button class="btn ${String(v)===String(val)?'active':''}" data-v="${esc(v)}">${esc(l)}</button>`; }).join('')}</div>`; }
function wireSeg(root, name, onChange){ const seg = root.querySelector(`[data-seg="${name}"]`); if (!seg) return; seg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; seg.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); onChange(b.dataset.v); }); }
function segVal(root, name){ const b = root.querySelector(`[data-seg="${name}"] .active`); return b ? b.dataset.v : null; }

    <button class="btn" data-k=".">.</button><button class="btn" data-k="0">0</button><button class="btn op" data-k="bs">⌫</button>
    <button class="btn done" data-k="done">DONE</button></div>
    <div class="actions">${xg?'<button class="btn" data-k="skip">NO LENGTH</button>':''}<button class="btn ghost" data-k="cancel">Cancel</button></div></div>`, {dismiss:false});

  job.photos.forEach((ph, i) => { const rec = imgCache.get(ph.id); doc.addPage(); header(`PHOTO ${ph.n}`); info(78);
    doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(...navy); doc.text(`Photo ${ph.n}  —  pin ${ph.n} on the drawing`, M, 118);
    if (rec) { const aw = PW-2*M, ah = PH-150-M; const s = Math.min(aw/rec.w, ah/rec.h); const w = rec.w*s, h = rec.h*s; try { doc.addImage(rec.url, 'JPEG', M + (aw-w)/2, 130, w, h, undefined, 'FAST'); } catch(e){ doc.text('(photo could not be embedded)', M, 150); } } else doc.text('(photo not available)', M, 150);
  });
  const total = doc.getNumberOfPages(); for (let i=1;i<=total;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(120); doc.text(`Page ${i} of ${total}  ·  ${filenameBase()}`, PW-M, PH-18, {align:'right'}); }
  deliver(doc.output('blob'), filenameBase()+'.pdf');
}
$('#tPdf').onclick = () => { try { exportPDF(); } catch(e) { console.error(e); toast('PDF export failed: ' + e.message); } };
$('#tPng').onclick = () => { try { exportPNG(); } catch(e) { console.error(e); toast('PNG export failed: ' + e.message); } };

/* ---------------- jobs list ---------------- */
function openJobs(){
  const rows = store.order.map(id => store.jobs[id]).filter(Boolean).map(j => `<div class="jobrow"><div class="jt"><b>${esc(j.customer||'(no name)')}${j.id===job.id?' <span class="tag">open</span>':''}</b><span>${esc(j.address||'—')} · ${esc(j.date)} · ${j.items.length} items, ${j.photos.length} photos</span></div><button class="btn sm" data-open="${j.id}">Open</button><button class="btn sm ghost" data-dup="${j.id}">Duplicate</button></div>`).join('');
  const ov = openSheet(`<h3>Jobs <span class="tag">last 20 · saved on this iPad</span></h3><div class="row"><button class="btn gold" id="jbNew">+ New job</button><button class="btn ghost" id="jbClose">Close</button></div><div class="joblist">${rows||'<p>No saved jobs yet.</p>'}</div>`);
  ov.querySelector('#jbClose').onclick = closeSheet;
  ov.querySelector('#jbNew').onclick = () => { closeSheet(); flushSave(); const j = newJob(); addJobToStore(j); openJob(j.id); toast('New job'); };
  ov.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { closeSheet(); flushSave(); openJob(b.dataset.open); });
  ov.querySelectorAll('[data-dup]').forEach(b => b.onclick = async () => { closeSheet(); flushSave(); const src = store.jobs[b.dataset.dup]; const j = JSON.parse(JSON.stringify(src)); j.id = uid(); j.date = todayISO(); j.created = j.updated = Date.now();
    for (const ph of j.photos) { const nid = uid(); const blob = await idb.get(ph.id); if (blob) await storeImage(nid, blob); ph.id = nid; }
    if (j.bg.imgId) { const nid = 'bg_'+uid(); const blob = await idb.get(j.bg.imgId); if (blob) await storeImage(nid, blob); j.bg.imgId = nid; }
    addJobToStore(j); openJob(j.id); toast('Duplicated'); });
}

/* ---------------- init ---------------- */
(async function init(){
  loadStore(); await idb.open();
  if (!(store.current && store.jobs[store.current])) { const j = newJob(); addJobToStore(j); store.current = j.id; }
  resize(); openJob(store.current);
  if (!localStorage.getItem('gs_welcomed')) { localStorage.setItem('gs_welcomed','1'); setTimeout(()=>toast('Add to Home Screen for full-screen use'), 800); }
})();
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gutter Sketch">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#001738">
<meta name="robots" content="noindex, nofollow">
<title>Gutter Sketch — Sergeant Seamless</title>
<style>
:root{--navy:#001738;--gold:#FFCE34;--cream:#FFF0C3;--red:#F15D22;--grey:#c9c9c9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--navy);overscroll-behavior:none;position:fixed;inset:0}
button{font:inherit;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--navy)}
#stage{position:relative;flex:1;overflow:hidden;background:#fff}
#cv{position:absolute;inset:0;touch-action:none;background:#fff;display:block}
.btn{min-height:48px;padding:0 14px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:15px;white-space:nowrap}
.btn.active{background:var(--gold);color:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{min-height:40px;font-size:14px;padding:0 10px}
.btn:disabled{opacity:.4}
.hidden{display:none!important}

/* ---------- FIELD MODE ---------- */
body.full #fieldUI{display:none}
body.field #fullUI{display:none}
#fieldUI .bigbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:var(--navy)}
#fieldUI .big{flex:1;min-height:104px;font-size:32px;font-weight:900;letter-spacing:1px;border-radius:16px;background:#fff;color:var(--navy);border:0}
#fieldUI .big.active{background:var(--gold)}
#fieldUI .big:active{transform:scale(.97)}
#fieldUI .ftop{position:absolute;top:0;left:0;right:0;display:flex;gap:10px;padding:10px;padding-top:calc(10px + env(safe-area-inset-top));pointer-events:none;align-items:flex-start}
#fieldUI .ftop>*{pointer-events:auto}
#fieldUI .ftop .btn{min-height:72px;font-size:22px;border-radius:14px;padding:0 20px}
#fieldUI .ftop .btn.active{background:var(--gold);border-color:var(--gold)}
#fieldUI .ftop .spacer{flex:1}
#fieldHint{position:absolute;left:50%;transform:translateX(-50%);top:calc(92px + env(safe-area-inset-top));background:var(--navy);color:#fff;font-weight:800;font-size:22px;padding:12px 22px;border-radius:14px;pointer-events:none;text-align:center;max-width:90vw}
#fieldHint:empty{display:none}

/* continue bar (both modes) */
#contBar{position:absolute;left:50%;transform:translateX(-50%);bottom:130px;display:flex;gap:10px;align-items:center;background:var(--cream);border:3px solid var(--navy);border-radius:14px;padding:8px 8px 8px 16px;font-weight:700;font-size:17px;z-index:5}
body.full #contBar{bottom:68px;z-index:9}
#contBar .btn{min-height:56px}

/* ---------- FULL MODE ---------- */
#fullUI{display:flex;flex-direction:column;position:absolute;inset:0;pointer-events:none}
#fullUI>*{pointer-events:auto}
#topbar{display:flex;gap:8px;padding:8px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--navy);flex-wrap:wrap;align-items:center}
#topbar input{min-height:44px;border:0;border-radius:8px;padding:0 10px;font-size:15px;background:#fff;color:var(--navy)}
#topbar .f{display:flex;flex-direction:column;gap:2px;color:var(--cream);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
#toolbar{display:flex;gap:6px;padding:6px 8px;background:#0b2a5c;flex-wrap:wrap;align-items:center}
#toolbar .btn{min-height:48px}
#toolbar .grow{flex:1}
#fullStage{position:relative;flex:1;pointer-events:none}
#fullStage>*{pointer-events:auto}

/* palette */
#palette{position:absolute;right:8px;top:8px;bottom:60px;width:232px;background:var(--cream);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden;transition:transform .2s}
#palette.collapsed{transform:translateX(192px)}
#palette .phead{display:flex;align-items:center;gap:6px;padding:6px;background:var(--navy);color:#fff;font-weight:800;font-size:14px}
#palette .phead .btn{min-height:40px;padding:0 10px}
#palette .pbody{overflow:auto;padding:8px;flex:1}
#palette.collapsed .pbody{display:none}
.pgroup{margin-bottom:10px}
.pgroup h4{margin:4px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#5a5a5a}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pgrid .btn{min-height:48px;font-size:13px;padding:0 6px;background:#fff;color:var(--navy);border:2px solid var(--navy)}
.pgrid .btn.active{background:var(--gold)}
.pgrid .btn.wide{grid-column:span 2}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:48px;height:48px;border-radius:10px;border:3px solid transparent}
.sw.active{border-color:var(--gold);box-shadow:0 0 0 2px var(--navy)}
.ginfo{font-size:12px;margin-top:4px}

/* photo strip */
#photoStrip{position:absolute;left:8px;bottom:60px;right:250px;height:84px;display:flex;gap:6px;overflow-x:auto;padding:6px;background:rgba(255,240,195,.95);border-radius:12px}
#photoStrip:empty{display:none}
#photoStrip .th{position:relative;flex:none;width:72px;height:72px;border-radius:8px;overflow:hidden;border:3px solid var(--navy);background:#000}
#photoStrip .th img{width:100%;height:100%;object-fit:cover}
#photoStrip .th span{position:absolute;left:3px;top:3px;background:var(--gold);color:var(--navy);font-weight:900;font-size:13px;border-radius:999px;min-width:22px;text-align:center;padding:2px 4px}

/* material panel */
#matPanel{position:absolute;left:0;right:0;bottom:0;background:var(--cream);border-top:4px solid var(--navy);max-height:46%;display:flex;flex-direction:column;transition:max-height .2s;z-index:7}
#matPanel.collapsed{max-height:52px}
#matPanel .mhead{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--navy);color:#fff;font-weight:800}
#matPanel .mhead .btn{min-height:40px}
#matPanel .mtabs{display:flex;gap:6px;flex-wrap:wrap}
#matPanel .mtabs .btn{min-height:36px;font-size:13px;padding:0 10px;background:#0b2a5c}
#matPanel .mbody{overflow:auto;padding:8px 12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
#matPanel.collapsed .mbody{display:none}
@media (max-width:760px){#matPanel .mbody{grid-template-columns:1fr}}
.mcol h4{margin:4px 0;font-size:12px;text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:6px}
.tag{font-size:10px;background:var(--navy);color:#fff;border-radius:6px;padding:2px 6px;text-transform:none;letter-spacing:0;font-weight:600}
.mt{width:100%;border-collapse:collapse;font-size:14px}
.mt td{padding:4px 6px;border-bottom:1px solid #e3d6a3}
.mt td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.mt input.ovin{width:72px;min-height:34px;border:1px solid #b9ae86;border-radius:6px;padding:2px 6px;text-align:right;font-weight:700;background:#fff}
.mt input.ovin.set{border:2px solid var(--navy);background:#FFF0C3}
.mt input.ovin::placeholder{color:#001738;opacity:.85}
.ovtag{font-size:10px;font-weight:700;color:#86090F;background:#FFF0C3;border-radius:4px;padding:1px 4px}
.mt .hl{cursor:pointer;text-decoration:underline dotted}.mt .hl small{font-size:10px;color:#555;font-weight:400}.mt .hl.on{color:var(--red);font-weight:800}
.mt tr.sub td{font-size:12px;color:#444;padding-left:18px}
.mt input{width:110px;min-height:40px;border:1px solid var(--navy);border-radius:6px;padding:0 8px;background:#fff;text-align:right}
.mfields{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:13px}
.mfields label{display:flex;flex-direction:column;gap:2px;font-weight:700}
.mfields input,.mfields select,.mfields textarea{min-height:40px;border:1px solid var(--navy);border-radius:6px;padding:4px 8px;background:#fff;font-weight:400}
.mfields .full{grid-column:span 2}

/* overlays / sheets */
.overlay{position:fixed;inset:0;background:rgba(0,23,56,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.sheet{background:var(--cream);border-radius:18px;padding:16px;max-width:96vw;max-height:92vh;overflow:auto;min-width:min(360px,96vw);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.sheet h3{margin:0 0 10px;font-size:18px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.sheet label.l{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;width:100%}
.sheet input[type=text],.sheet input[type=number],.sheet textarea{min-height:48px;border:2px solid var(--navy);border-radius:10px;padding:6px 10px;font-size:18px;background:#fff;flex:1;min-width:120px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn{background:#fff;color:var(--navy);border:2px solid var(--navy);min-width:56px}
.seg .btn.active{background:var(--gold)}
.seg.big .btn{min-height:72px;font-size:26px;min-width:72px;padding:0 12px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.actions .btn{min-height:56px;font-size:17px;padding:0 20px}
.seqbox{min-height:56px;border:2px solid var(--navy);border-radius:10px;background:#fff;font-size:28px;font-weight:900;letter-spacing:4px;padding:6px 12px;flex:1;display:flex;align-items:center;min-width:140px}
.seqbox:empty::before{content:"—";color:#aaa}

/* numpad */
#numpad .disp{font-size:44px;font-weight:900;text-align:right;background:#fff;border:3px solid var(--navy);border-radius:14px;padding:8px 16px;min-height:72px;margin-bottom:10px}
#numpad .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#numpad .keys .btn{min-height:76px;font-size:30px;background:#fff;color:var(--navy);border:2px solid var(--navy)}
#numpad .keys .btn.op{background:var(--navy);color:#fff}
#numpad .keys .btn.done{background:var(--gold);color:var(--navy);grid-column:span 3;font-size:28px}

/* prop panel (select) */
#props{position:absolute;left:8px;top:8px;width:300px;max-height:min(62%,calc(100% - 80px));overflow:auto;background:var(--cream);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.3);padding:10px;z-index:6}
#props h3{margin:0 0 8px;font-size:16px}
#props .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
#props label.l{font-size:11px;font-weight:800;text-transform:uppercase;width:100%;letter-spacing:.5px}
#props .seg .btn{min-height:44px;font-size:13px;min-width:44px;padding:0 8px}
#props input[type=text],#props input[type=number]{min-height:44px;border:2px solid var(--navy);border-radius:8px;padding:4px 8px;font-size:16px;background:#fff;flex:1;min-width:80px}
#props .actions .btn{min-height:48px;font-size:15px}

/* job list */
.joblist{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.jobrow{display:flex;gap:8px;align-items:center;background:#fff;border-radius:10px;padding:8px}
.jobrow .jt{flex:1;min-width:0}
.jobrow .jt b{display:block;font-size:16px}
.jobrow .jt span{font-size:13px;color:#444}
.vlist{margin:0;padding-left:20px;font-size:16px;line-height:1.5}
#photoView img{max-width:92vw;max-height:70vh;border-radius:10px;background:#000}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:40%;background:var(--navy);color:#fff;padding:14px 22px;border-radius:14px;font-weight:800;font-size:18px;z-index:99;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
</style>
</head>
<body class="field">
<div id="app">
<div id="stage">
  <canvas id="cv"></canvas>

  <!-- ===== FIELD MODE UI ===== -->
  <div id="fieldUI">
    <div class="ftop">
      <button class="btn ghost" id="fUndo">↶ UNDO</button>
      <button class="btn ghost" id="fJobs">JOBS</button>
      <button class="btn ghost" id="fExist">EXISTING</button>
      <button class="btn ghost" id="fLen">LENGTHS</button>
      <button class="btn ghost standBtn" id="fStand">STANDING AT: FRONT</button>
      <span class="spacer"></span>
      <button class="btn gold" id="fFinish">FINISH IN TRUCK ▸</button>
    </div>
    <div id="fieldHint"></div>
    <div class="bigbar">
      <button class="big" id="fRun">RUN</button>
      <button class="big" id="fDs">DOWNSPOUT</button>
      <button class="big" id="fPhoto">PHOTO</button>
    </div>
  </div>

  <!-- continue-from-last-run bar -->
  <div id="contBar" class="hidden">
    <span id="contLabel">Continue from last run end?</span>
    <button class="btn gold" id="contYes">CONTINUE</button>
    <button class="btn ghost" id="contNo">NEW START</button>
  </div>

  <!-- ===== FULL MODE UI ===== -->
  <div id="fullUI">
    <div id="topbar">
      <label class="f">Customer<input id="jCustomer" type="text" placeholder="Last, First" autocomplete="off"></label>
      <label class="f" style="flex:1;min-width:200px">Address<input id="jAddress" type="text" placeholder="123 Street, City" autocomplete="off" style="width:100%"></label>
      <label class="f">Date<input id="jDate" type="date"></label>
      <label class="f">Jobber Quote #<input id="jQuote" type="text" placeholder="#" style="width:110px" autocomplete="off"></label>
      <label class="f">Prepared by<input id="jPrep" type="text" placeholder="Name" style="width:130px" autocomplete="off"></label>
    </div>
    <div id="toolbar">
      <button class="btn" id="tUndo">↶ Undo</button>
      <button class="btn" id="tRedo">↷ Redo</button>
      <button class="btn" id="tSelect" data-tool="select">Select</button>
      <button class="btn" id="tMulti" title="Select several items at once">Multi</button>
      <button class="btn" id="tPan" data-tool="pan">Pan/Zoom</button>
      <button class="btn ghost" id="tField">◂ Field Mode</button>
      <button class="btn ghost standBtn" id="tStand" title="Turn the drawing to match the side of the house you are standing at">STANDING AT: FRONT</button>
      <span class="grow"></span>
      <button class="btn ghost" id="tBg">Background</button>
      <button class="btn ghost" id="tJobs">Jobs</button>
      <button class="btn ghost" id="tNew">New job</button>
      <button class="btn gold" id="tExport">Export ▸</button>
    </div>
    <div id="fullStage">
      <!-- right palette -->
      <div id="palette">
        <div class="phead"><button class="btn" id="pToggle">◂</button><span id="pTitle">Tools</span></div>
        <div class="pbody">
          <div class="pgroup"><h4>Group</h4>
            <div class="swatches" id="groupSw"></div>
            <div class="ginfo" id="groupInfo"></div>
          </div>
          <div class="pgroup"><h4>Gutter</h4>
            <div class="pgrid">
              <button class="btn wide" data-tool="run">Gutter Run</button>
              <button class="btn wide" data-tool="run" data-sub="existing">Existing Gutter (dashed)</button>
              <button class="btn wide" data-tool="ds">Downspout</button>
            </div>
          </div>
          <div class="pgroup"><h4>Accessories</h4>
            <div class="pgrid">
              <button class="btn" data-tool="acc" data-sub="splashguard">Splash Guard</button>
              <button class="btn" data-tool="acc" data-sub="splashblock">Splash Block</button>
              <button class="btn" data-tool="acc" data-sub="dropoutlet">Drop Outlet ○</button>
              <button class="btn" data-tool="acc" data-sub="rainchain">Rain Chain</button>
            </div>
          </div>
          <div class="pgroup"><h4>Story labels (drop on a section)</h4>
            <div class="pgrid" style="grid-template-columns:repeat(3,1fr)">
              <button class="btn" data-tool="tag" data-sub="1">1 st</button>
              <button class="btn" data-tool="tag" data-sub="1.5">1.5 st</button>
              <button class="btn" data-tool="tag" data-sub="2">2 st</button>
              <button class="btn" data-tool="tag" data-sub="2.5">2.5 st</button>
              <button class="btn" data-tool="tag" data-sub="3">3 st</button>
            </div>
          </div>
          <div class="pgroup"><h4>Hazards / Attention</h4>
            <div class="pgrid">
              <button class="btn" data-tool="haz" data-sub="ac">AC Unit</button>
              <button class="btn" data-tool="haz" data-sub="pool">Pool</button>
              <button class="btn" data-tool="haz" data-sub="dish">Sat. Dish</button>
              <button class="btn" data-tool="haz" data-sub="chimney">Chimney</button>
              <button class="btn" data-tool="haz" data-sub="power">Power Line</button>
              <button class="btn" data-tool="haz" data-sub="landscape">Landscaping</button>
              <button class="btn wide" data-tool="haz" data-sub="warn">⚠ Warning</button>
            </div>
          </div>
          <div class="pgroup"><h4>Ink &amp; Text</h4>
            <div class="pgrid">
              <button class="btn" data-tool="ink">Pencil Ink</button>
              <button class="btn" data-tool="text">Text Callout</button>
            </div>
            <div class="swatches" style="margin-top:6px">
              <button class="sw" data-ink="#000000" style="background:#000"></button>
              <button class="sw" data-ink="#001738" style="background:#001738"></button>
              <button class="sw" data-ink="#F15D22" style="background:#F15D22"></button>
              <button class="btn sm" data-inkw="3" style="min-width:48px">Thin</button>
              <button class="btn sm" data-inkw="7" style="min-width:48px">Thick</button>
            </div>
          </div>
        </div>
      </div>

      <!-- props panel -->
      <div id="props" class="hidden"></div>

      <!-- photo strip -->
      <div id="photoStrip"></div>

      <!-- material list -->
      <div id="matPanel" class="collapsed">
        <div class="mhead">
          <button class="btn" id="mToggle">▴</button>
          <span>Material List</span>
          <span class="mtabs" id="mTabs"></span>
          <span style="flex:1"></span>
          <span class="tag">live · from drawing</span>
        </div>
        <div class="mbody">
          <div class="mcol" id="mAuto"></div>
          <div class="mcol" id="mManual"></div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>

<input type="file" id="camInput" accept="image/*" capture="environment" class="hidden">
<input type="file" id="bgInput" accept="image/*,application/pdf" class="hidden">
<div id="sheets"></div>
<div id="toast"></div>
<a id="dl" class="hidden"></a>

<!-- PDF library loads in the background so a slow connection never blocks the app; pdf.js is fetched only when a PDF is imported -->
<script async src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(() => {
'use strict';
/* =====================================================================
   Gutter Sketch — Sergeant Seamless Gutter Services
   Single-file field sketch app. No backend. Vanilla JS.
   ===================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const dist = (a,b,c,d) => Math.hypot(c-a, d-b);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

const GROUPS = [
  {n:'Base',     c:'#001738', short:'B'},
  {n:'Option 1', c:'#FFCE34', short:'1'},
  {n:'Option 2', c:'#F15D22', short:'2'},
  {n:'Option 3', c:'#4E58A7', short:'3'},
  {n:'Option 4', c:'#91982C', short:'4'},
  {n:'Option 5', c:'#252379', short:'5'},
];
const NAVY='#001738', GOLD='#FFCE34', CREAM='#FFF0C3', RED='#F15D22', ERR='#E00000';
const GRID = 20;                 // world units per grid square
const PROFILES = ['6" K','7" K','6" Half Round','European Box'];                     // matches the Jobber "Gutter Size" field
const PROFILE_MAP = {'6"K':'6" K','7"K':'7" K','Half Round':'6" Half Round','EuroBox':'European Box','Other':'6" K'};
const COLORS = ['white','satin white','linen','cameo','herringbone','almond','raffia beige','wicker','clay','wood beige','heritage cream','classic cream','antique ivory','buckskin brown','beaver brown','royal brown','musket brown','colonial red','colonial gray','dove gray','tuxedo gray','terratone','bronze','black','sherwood green','colonial blue','paint grip metallic','copper metallic','rustic copper','solid copper','galvalume','cream','pearl gray','eggshell','Sandcastle','Dark Gray','Light Bronze','no color match','to be determined','custom'];
const NO_PAINT_COLORS = ['white','satin white','buckskin brown','beaver brown','royal brown','musket brown'];
const WEDGES = [['none','No wedges'],['regular','Regular'],['steep','Steep'],['t','T wedges']];
const SPLASH_GUARD_LF = 2.5;   // feet of coil added per splash guard
const ENDS = [['auto','Auto'],['endcap','End cap'],['miter_in','Miter inside'],['miter_out','Miter outside'],['miter_bay_in','Bay miter inside'],['miter_bay_out','Bay miter outside'],['continues','Continues']];
const COVER_TYPES = ['ProGuard','Expanded Metal Mesh','Leaf Blaster Pro'];

/* ---------------- storage ---------------- */
const LS_KEY = 'gs_store_v1';
let store = {jobs:{}, order:[], current:null};
function loadStore(){ try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && s.jobs && s.order) store = s; } catch(e){} }
function saveStore(){ try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch(e){ toast('Autosave failed — storage full?'); } }

const idb = {
  db:null,
  open(){ return new Promise((res) => {
    if (!('indexedDB' in window)) return res();
    const r = indexedDB.open('gs_blobs', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('blobs');
    r.onsuccess = () => { idb.db = r.result; res(); };
    r.onerror = () => res();
  }); },
  tx(mode){ return idb.db.transaction('blobs', mode).objectStore('blobs'); },
  put(k, v){ return new Promise((res,rej)=>{ if(!idb.db) return rej(); const q = idb.tx('readwrite').put(v,k); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); }); },
  get(k){ return new Promise((res)=>{ if(!idb.db) return res(null); const q = idb.tx('readonly').get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); },
  del(k){ return new Promise((res)=>{ if(!idb.db) return res(); const q = idb.tx('readwrite').delete(k); q.onsuccess=()=>res(); q.onerror=()=>res(); }); },
};
// in-memory image cache: id -> {url(dataURL), w, h, img}
const imgCache = new Map();
function blobToDataURL(b){ return new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); }); }
function loadImg(url){ return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = url; }); }
async function cacheImage(id){
  if (imgCache.has(id)) return imgCache.get(id);
  const blob = await idb.get(id); if (!blob) return null;
  const url = await blobToDataURL(blob); const img = await loadImg(url); if (!img) return null;
  const rec = {url, w: img.naturalWidth, h: img.naturalHeight, img}; imgCache.set(id, rec); return rec;
}
async function storeImage(id, blob){
  const url = await blobToDataURL(blob); const img = await loadImg(url);
  imgCache.set(id, {url, w: img.naturalWidth, h: img.naturalHeight, img});
  try { await idb.put(id, blob); } catch(e){ toast('Photo kept in memory only — storage unavailable'); }
}
// downscale a camera file to a JPEG blob
function shrinkImage(file, max){ return new Promise(res => {
  const url = URL.createObjectURL(file); const im = new Image();
  im.onload = () => { const s = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth*s); c.height = Math.round(im.naturalHeight*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url);
    c.toBlob(b => res(b), 'image/jpeg', 0.82); };
  im.onerror = () => res(null); im.src = url; }); }

/* ---------------- job model ---------------- */
function newJob(){
  return { id: uid(), customer:'', address:'', date: todayISO(), quote:'', prep: localStorage.getItem('gs_prep') || '',
    items: [], photos: [], photoSeq: 0,
    bg: {type:'grid', rot:0, imgId:null, w:0, h:0},
    manual: {gutterColor:'', gutterCustom:'', dsColor:'', dsCustom:'', wedges:'', coverType:'', hangerOv:{}, rcKitOv:{}, geocelOv:{}, ovr:{}, flexPipes:'', geocel:'', screws:'', poDelivery:'', fascia:'', soffit:'', jchannel:'', collectorBox:'', misc:'', notes:'', straps:{}}, corners:{}, v:4,
    defaults: {profile:'6" K', cover:false, story:1, lend:'auto', rend:'auto', dsSize:'3×4"', dsStory:1, dsTerm:'', group:0},
    view: {tx:80, ty:140, s:1}, mode:'field', created: Date.now(), updated: Date.now() };
}
let job = null;
function openJob(id){
  job = store.jobs[id]; store.current = id;
  // migrate missing fields defensively
  const fresh = newJob(); const hadV = job.v;
  for (const k of Object.keys(fresh)) if (job[k] === undefined) job[k] = fresh[k];
  job.v = hadV;
  job.manual.straps ||= {}; job.corners ||= {};
  if (!job.v || job.v < 2) { // v1 -> v2: ends were defaulted to end cap; elbow sequence was a plain string
    for (const it of job.items) {
      if (it.type==='run') { if (it.lend==='endcap') it.lend='auto'; if (it.rend==='endcap') it.rend='auto'; }
      if (it.type==='ds' && typeof it.seq === 'string') it.seq = it.seq.split('').filter(c => c==='A'||c==='B');
    }
    if (job.defaults.lend==='endcap') job.defaults.lend='auto'; if (job.defaults.rend==='endcap') job.defaults.rend='auto';
    job.v = 2;
  }
  for (const it of job.items) if (it.type==='ds' && it.term==='lowerroof') { it.story = 'LR'; it.term = 'other'; }
  if (job.v < 3) { // v2 -> v3: Jobber-aligned profile/size names, wedges replace hanger type, zip screws gone
    for (const it of job.items) { if (it.type==='run' && PROFILE_MAP[it.profile]) it.profile = PROFILE_MAP[it.profile]; if (it.type==='ds' && DS_SIZE_MAP[it.size]) it.size = DS_SIZE_MAP[it.size]; }
    if (PROFILE_MAP[job.defaults.profile]) job.defaults.profile = PROFILE_MAP[job.defaults.profile]; if (DS_SIZE_MAP[job.defaults.dsSize]) job.defaults.dsSize = DS_SIZE_MAP[job.defaults.dsSize];
    const mn = job.manual; if (mn.wedges===undefined) mn.wedges = 'none'; mn.hangerOv ||= {}; mn.geocelOv ||= {}; mn.ovr ||= {}; if (mn.geocel!=='' && mn.geocel!=null && mn.geocelOv.all===undefined) { mn.geocelOv.all = +mn.geocel; } mn.geocel = ''; mn.gutterCustom ||= ''; mn.dsCustom ||= ''; delete mn.hangerType; delete mn.hangerQty; delete mn.zipScrews; delete mn.sprayPaint; delete mn.offsets;
    if (mn.gutterColor && !COLORS.includes(mn.gutterColor)) { mn.gutterCustom = mn.gutterColor; mn.gutterColor = 'custom'; } if (mn.dsColor && !COLORS.includes(mn.dsColor)) { mn.dsCustom = mn.dsColor; mn.dsColor = 'custom'; }
    job.v = 3;
  }
  for (const k of Object.keys(fresh.manual)) if (job.manual[k] === undefined) job.manual[k] = fresh.manual[k];
  if (job.v < 4) { // v3 -> v4: bay miters split into inside / outside (old 'bay' = outside bay)
    for (const k of Object.keys(job.corners)) if (job.corners[k]==='miter_bay') job.corners[k] = 'miter_bay_out';
    for (const it of job.items) if (it.type==='run') { if (it.lend==='miter_bay') it.lend='miter_bay_out'; if (it.rend==='miter_bay') it.rend='miter_bay_out'; }
    job.v = 4;
  }
  for (const it of job.items) if (it.type==='ds' && !Array.isArray(it.seq)) it.seq = typeof it.seq==='string' ? it.seq.split('').filter(c=>c==='A'||c==='B') : [];
  undoStack.length = 0; redoStack.length = 0; sel = null; multi.clear(); pendingStart = null; lastEnd = null; lastTouch = null;
  const runs = job.items.filter(i => i.type === 'run'); if (runs.length) { const r = runs[runs.length-1]; lastEnd = {x:r.x2, y:r.y2}; }
  setMode(job.mode || 'field', true);
  saveStore();
  Promise.all([...job.photos.map(p => cacheImage(p.id)), job.bg.imgId ? cacheImage(job.bg.imgId) : null]).then(() => { renderPhotoStrip(); render(); });
  syncHeader(); renderPhotoStrip(); renderMaterials(); render();
}
function addJobToStore(j){
  store.jobs[j.id] = j; store.order.unshift(j.id);
  while (store.order.length > 20) { const old = store.order.pop(); const oj = store.jobs[old]; if (oj) { oj.photos.forEach(p => idb.del(p.id)); if (oj.bg.imgId) idb.del(oj.bg.imgId); } delete store.jobs[old]; }
}
let dirtyTimer = null;
function touch(){ // mark dirty, autosave soon
  if (!job) return; job.updated = Date.now();
  clearTimeout(dirtyTimer); dirtyTimer = setTimeout(() => { bumpRecent(); saveStore(); }, 1500);
}
function bumpRecent(){ const i = store.order.indexOf(job.id); if (i > 0) { store.order.splice(i,1); store.order.unshift(job.id); } }
function flushSave(){ clearTimeout(dirtyTimer); if (job) { bumpRecent(); saveStore(); } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });
window.addEventListener('pagehide', flushSave);
window.addEventListener('beforeunload', flushSave);

/* ---------------- undo / redo ---------------- */
const undoStack = [], redoStack = [];
function snapshot(){ undoStack.push(JSON.stringify(job.items)); if (undoStack.length > 60) undoStack.shift(); redoStack.length = 0; }
function undo(){ if (!undoStack.length) return toast('Nothing to undo'); redoStack.push(JSON.stringify(job.items)); job.items = JSON.parse(undoStack.pop()); afterItemsChanged(); }
function redo(){ if (!redoStack.length) return toast('Nothing to redo'); undoStack.push(JSON.stringify(job.items)); job.items = JSON.parse(redoStack.pop()); afterItemsChanged(); }
function afterItemsChanged(){
  if (sel && !job.items.find(i => i.id === sel)) { sel = null; hideProps(); }
  for (const id of [...multi]) if (!job.items.find(i => i.id === id)) multi.delete(id);
  const runs = job.items.filter(i => i.type === 'run'); lastEnd = runs.length ? {x:runs[runs.length-1].x2, y:runs[runs.length-1].y2} : null;
  if (pendingStart && lastEnd && pendingStart.fromLast) pendingStart = {...lastEnd, fromLast:true};
  if (pendingStart && !lastEnd && pendingStart.fromLast) pendingStart = null;
  updateHints(); renderMaterials(); touch(); render();
}

/* ---------------- canvas / view ---------------- */
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1;
function resize(){ dpr = Math.min(window.devicePixelRatio || 1, 3); const r = $('#stage').getBoundingClientRect(); W = r.width; H = r.height; cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); cv.style.width = W+'px'; cv.style.height = H+'px'; render(); }
window.addEventListener('resize', () => setTimeout(resize, 50));
// view rotation (quarter turns, clockwise) — screen only; saved drawing and exports stay street-side down
const VROT = () => ((job.view.rot||0)%4+4)%4;
const rotV = (x, y, q) => q===1 ? [-y, x] : q===2 ? [-x, -y] : q===3 ? [y, -x] : [x, y];
const toWorld = (sx, sy) => { const [x,y] = rotV(sx - job.view.tx, sy - job.view.ty, (4-VROT())%4); return {x: x/job.view.s, y: y/job.view.s}; };
const toScreen = (wx, wy) => { const [x,y] = rotV(wx*job.view.s, wy*job.view.s, VROT()); return {x: x + job.view.tx, y: y + job.view.ty}; };
function keepPoint(wx, wy, sx, sy, s){ job.view.s = s; const [x,y] = rotV(wx*s, wy*s, VROT()); job.view.tx = sx - x; job.view.ty = sy - y; }   // zoom/rotate around a world point
const STAND = ['Front','Right','Back','Left'];
function setStand(q){ const c = toWorld(W/2, H/2); job.view.rot = q; keepPoint(c.x, c.y, W/2, H/2, job.view.s); $$('.standBtn').forEach(b => b.textContent = 'STANDING AT: ' + STAND[q].toUpperCase()); touch(); render(); }
const isField = () => document.body.classList.contains('field');

/* ---------------- painter abstraction (canvas + pdf share the same scene code) ---------------- */
function canvasPainter(c, vq){   // vq = on-screen view rotation in quarter turns (text is kept upright for the reader)
  vq = vq || 0;
  return {
    line(x1,y1,x2,y2,o={}){ c.save(); c.strokeStyle=o.color||NAVY; c.lineWidth=o.width||3; c.lineCap='round'; c.lineJoin='round'; c.setLineDash(o.dash||[]); c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); c.restore(); },
    poly(pts,o={}){ if(pts.length<2&&!o.fill) return; c.save(); c.lineWidth=o.width||3; c.lineCap='round'; c.lineJoin='round'; c.setLineDash(o.dash||[]); c.beginPath(); c.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) c.lineTo(pts[i][0],pts[i][1]); if(o.close) c.closePath(); if(o.fill){ c.fillStyle=o.fill; c.fill(); } if(o.color){ c.strokeStyle=o.color; c.stroke(); } c.restore(); },
    rect(x,y,w,h,o={}){ c.save(); if(o.fill){ c.fillStyle=o.fill; c.fillRect(x,y,w,h); } if(o.color){ c.strokeStyle=o.color; c.lineWidth=o.width||2; c.strokeRect(x,y,w,h); } c.restore(); },
    circle(x,y,r,o={}){ c.save(); c.beginPath(); c.arc(x,y,r,0,Math.PI*2); if(o.fill){ c.fillStyle=o.fill; c.fill(); } if(o.color){ c.strokeStyle=o.color; c.lineWidth=o.width||2; c.stroke(); } c.restore(); },
    text(str,x,y,o={}){ if (o.color && String(o.color).toUpperCase()===GOLD && (o.bg==='#fff' || !o.bg)) { o = {...o, color:NAVY, bg:GOLD, bgStroke:NAVY}; }   /* Option 1: gold-on-white is unreadable — navy on a gold label */ c.save(); const size=o.size||12; c.font=`${o.bold?'700':'500'} ${size}px -apple-system,Helvetica,Arial,sans-serif`; c.textAlign=o.align||'center'; c.textBaseline='middle'; c.translate(x,y); { let a = o.angle||0; if (vq) { const R = vq*Math.PI/2; if (o.angle===undefined) a = -R; else { let sa = a + R; sa = Math.atan2(Math.sin(sa), Math.cos(sa)); if (sa >= Math.PI/2 - 1e-6) sa -= Math.PI; else if (sa < -Math.PI/2 - 1e-6) sa += Math.PI; a = sa - R; } } if (a) c.rotate(a); }
      if(o.bg){ const w=c.measureText(str).width+size*0.7, h=size*1.35; const bx = o.align==='left'?-size*0.35:(o.align==='right'?-w+size*0.35:-w/2); c.fillStyle=o.bg; c.beginPath(); c.roundRect? c.roundRect(bx,-h/2,w,h,3): c.rect(bx,-h/2,w,h); c.fill(); if(o.bgStroke){ c.strokeStyle=o.bgStroke; c.lineWidth=1.2; c.stroke(); } }
      c.fillStyle=o.color||NAVY; c.fillText(str,0,0); c.restore(); },
    image(img,x,y,w,h,rot){ c.save(); c.translate(x+w/2,y+h/2); c.rotate((rot||0)*Math.PI/2); c.drawImage(img,-w/2,-h/2,w,h); c.restore(); }
  };
}

function handleTap(w, e){

  if (tool==='acc') { snapshot(); job.items.push({type:'acc', sub:toolSub, id:uid(), g:curGroup, x:w.x, y:w.y, rot:0}); afterItemsChanged(); return; }
  if (tool==='haz') { snapshot(); job.items.push({type:'haz', sub:toolSub, id:uid(), x:w.x, y:w.y}); afterItemsChanged(); return; }
  if (tool==='tag') { snapshot(); job.items.push({type:'tag', story:toolSub, id:uid(), x:w.x, y:w.y}); afterItemsChanged(); return; }
  if (tool==='text') return openTextSheet(w, null);
  if (tool==='select') { const pin = hitPin(w.x,w.y); if (pin) return openPhotoViewer(pin.id);
    const corner = resolveEnds().corners.find(c => c.kind!=='seam' && dist(w.x,w.y,c.x,c.y) < 14/job.view.s); if (corner) return cycleCorner(corner);
    const hit = hitTest(w.x,w.y); if (hit) selectItem(hit); else { sel = null; if (!multiMode) multi.clear(); showProps(); render(); } return; }

}
function cycleCorner(c){

  lastCornerTap = {key:null, t:0};

  const flip = k => ({miter_in:'miter_out', miter_out:'miter_in', miter_bay_in:'miter_bay_out', miter_bay_out:'miter_bay_in'})[k];
  const fam = k => ({miter_in:'miter_bay_in', miter_out:'miter_bay_out', miter_bay_in:'miter_in', miter_bay_out:'miter_out'})[k];
  const base = (c.autoKind && c.autoKind!=='seam') ? c.autoKind : (c.kind==='seam' ? 'miter_out' : c.kind); const ring = [null, flip(base), fam(base), flip(fam(base))];

// add every item that lies inside the box to the multi-selection (runs: both ends inside; ink: whole stroke; others: their anchor point)
function boxSelect(mq){

      else if (it.size!=='Smooth Square') { for (const t of (it.seq||[])) { if (t==='A') m.elbA++; else if (t==='B') m.elbB++; else if (m.offsets[t]!==undefined) m.offsets[t]++; } }   // smooth square: elbows/offsets custom-cut from downspout stock, not counted

function pdfMaterialsPages(doc){

    doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(...navy); doc.text(`Photo ${ph.n}  —  pin ${ph.n} on the drawing`, M, FRAME.bodyTop+4);

  return pages;
}

// ---- canvas frame (for the drawing PNG)
function canvasFrame(x, title){
  const hex = a => `rgb(${a[0]},${a[1]},${a[2]})`; const {navy,gold,cream,maroon,rayFill,grey} = RGB;
  x.fillStyle='#fff'; x.fillRect(0,0,PW,PH);
  x.save(); x.beginPath(); x.rect(0,0,PW,FRAME.headerH); x.clip(); x.fillStyle=hex(rayFill); for (const w of rayWedges()) { x.beginPath(); x.moveTo(...w[0]); x.lineTo(...w[1]); x.lineTo(...w[2]); x.closePath(); x.fill(); } x.restore();
  try { const h = 100, w = h*BRAND.logoRatio; x.drawImage(BRAND_IMG.logo, 16, 6, w, h); } catch(e){}
  x.textAlign='right'; x.textBaseline='alphabetic'; x.fillStyle=hex(navy); x.font='900 24px Helvetica,Arial'; x.fillText(title, PW-M, 46);
  x.fillStyle=hex(maroon); x.font='italic 700 16px "Snell Roundhand","Brush Script MT","Apple Chancery",cursive'; x.fillText('Let the Sarge Take Charge!', PW-M, 65);
  x.fillStyle=hex(navy); x.font='800 7.5px Helvetica,Arial'; x.fillText('VETERAN-OWNED   ·   JACKSONVILLE, FL', PW-M, 80);
  x.fillStyle=hex(navy); x.fillRect(0,FRAME.ruleY,PW,4); x.fillStyle=hex(gold); x.fillRect(0,FRAME.ruleY+4,PW,4);
  x.fillStyle=hex(cream); x.fillRect(0,FRAME.infoY,PW,FRAME.infoH);
  x.textAlign='left'; let cx = M; for (const [l,v,w] of infoCols()) { x.fillStyle=hex(maroon); x.font='800 7px Helvetica,Arial'; x.fillText(l, cx, FRAME.infoY+15); x.fillStyle=hex(navy); x.font='800 10.5px Helvetica,Arial'; let s = String(v||''); while (x.measureText(s).width > w-8 && s.length>3) s = s.slice(0,-2); x.fillText(s, cx, FRAME.infoY+30); cx += w; }
  x.fillStyle=hex(gold); x.fillRect(0,FRAME.footerRule,PW,3); x.fillStyle=hex(navy); x.fillRect(0,FRAME.footerRule+3,PW,2);
  x.fillStyle=hex(maroon); x.font='italic 700 13px "Snell Roundhand","Brush Script MT","Apple Chancery",cursive'; x.fillText('Call', M, PH-12);
  x.fillStyle=hex(navy); x.font='800 10px Helvetica,Arial'; x.fillText('904-384-3423   ·   SergeantSeamless.com', M+26, PH-12);
  x.textAlign='right'; x.font='400 7px Helvetica,Arial'; x.fillText('5876 Old Timuquana Rd, Jacksonville FL 32210  ·  contact@sergeantseamless.com', PW-M, PH-19);
  x.fillStyle=hex(grey); x.font='400 6.5px Helvetica,Arial'; x.fillText(filenameBase(), PW-M, PH-9); x.textAlign='left';
}
function exportDrawingPNG(){

  const legendH = 12 + (groups.length?14:0) + legendRowCount()*LG_ROW + 12;

function exportDrawingPDF(){

function exportMaterialsPDF(){

function openExportSheet(){
  const ov = openSheet(`<h3>Export</h3>
    <div class="row"><button class="btn gold" id="exPng" style="min-height:64px;flex:1;text-align:left;padding:0 16px"><b>Drawing — PNG</b><br><span style="font-weight:400;font-size:13px">Attach to the Jobber quote (customer sees this)</span></button></div>
    <div class="row"><button class="btn" id="exPdf" style="min-height:56px;flex:1;text-align:left;padding:0 16px"><b>Drawing — PDF</b><br><span style="font-weight:400;font-size:13px">Same page, print-ready for the crew</span></button></div>
    <div class="row"><button class="btn" id="exMat" style="min-height:56px;flex:1;text-align:left;padding:0 16px"><b>Materials + photos — PDF</b><br><span style="font-weight:400;font-size:13px">Internal · attach as a note, not to the quote</span></button></div>
    <div class="actions"><button class="btn ghost" id="exClose">Cancel</button></div>`);

$('#tExport').onclick = openExportSheet;

/* ---------------- jobs list ---------------- */
function openJobs(){
  const rows = store.order.map(id => store.jobs[id]).filter(Boolean).map(j => `<div class="jobrow"><div class="jt"><b>${esc(j.customer||'(no name)')}${j.id===job.id?' <span class="tag">open</span>':''}</b><span>${esc(j.address||'—')} · ${esc(j.date)} · ${j.items.length} items, ${j.photos.length} photos</span></div><button class="btn sm" data-open="${j.id}">Open</button><button class="btn sm ghost" data-dup="${j.id}">Duplicate</button></div>`).join('');
  const ov = openSheet(`<h3>Jobs <span class="tag">last 20 · saved on this iPad</span></h3><div class="row"><button class="btn gold" id="jbNew">+ New job</button><button class="btn ghost" id="jbClose">Close</button></div><div class="joblist">${rows||'<p>No saved jobs yet.</p>'}</div>`);
  ov.querySelector('#jbClose').onclick = closeSheet;
  ov.querySelector('#jbNew').onclick = () => { closeSheet(); flushSave(); const j = newJob(); addJobToStore(j); openJob(j.id); toast('New job'); };
  ov.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { closeSheet(); flushSave(); openJob(b.dataset.open); });
  ov.querySelectorAll('[data-dup]').forEach(b => b.onclick = async () => { closeSheet(); flushSave(); const src = store.jobs[b.dataset.dup]; const j = JSON.parse(JSON.stringify(src)); j.id = uid(); j.date = todayISO(); j.created = j.updated = Date.now();
    for (const ph of j.photos) { const nid = uid(); const blob = await idb.get(ph.id); if (blob) await storeImage(nid, blob); ph.id = nid; }
    if (j.bg.imgId) { const nid = 'bg_'+uid(); const blob = await idb.get(j.bg.imgId); if (blob) await storeImage(nid, blob); j.bg.imgId = nid; }
    addJobToStore(j); openJob(j.id); toast('Duplicated'); });
}

/* ---------------- init ---------------- */
(async function init(){
  loadStore(); await idb.open();
  if (!(store.current && store.jobs[store.current])) { const j = newJob(); addJobToStore(j); store.current = j.id; }
  resize(); openJob(store.current);
  if (!localStorage.getItem('gs_welcomed')) { localStorage.setItem('gs_welcomed','1'); setTimeout(()=>toast('Add to Home Screen for full-screen use'), 800); }
})();
})();
